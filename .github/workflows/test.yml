name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # main のときだけ gh-pages（ダッシュボードと ブラウザで 遊べる 版）へ push する
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/compare/build.sh が 前の コミットから 書き出すので、履歴を 全部 取る
      - name: Download Godot 4.7
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
      # ブラウザで 遊べる 版（Web）を 書き出す ための テンプレート。配布の 書庫は 1.3 GB あるので、Web の 分だけ 取り出して キャッシュする
      - name: Cache the Web export template
        id: web-template
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.stable
          key: godot-4.7-stable-web-nothreads-release
      - name: Download the Web export template
        if: steps.web-template.outputs.cache-hit != 'true'
        run: |
          curl -sSL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -o -j -q /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d ~/.local/share/godot/export_templates/4.7.stable
          rm /tmp/templates.tpz
      - name: Import, floor probe and autopilot smoke test (all episodes and places)
        run: GODOT="$PWD/Godot_v4.7-stable_linux.x86_64" tools/run_tests.sh
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/inside-body-seek-test.log*
      # ブラウザで 遊べる 版（ダッシュボードの「あそんで たしかめる」の 先）。テストが 落ちても 書き出す。
      # 書き出しに 失敗しても ダッシュボードは 出す（その ときは あそぶ ボタンが 出ない）
      - name: Export the Web build (play in the browser)
        if: always()
        continue-on-error: true
        run: GODOT="$PWD/Godot_v4.7-stable_linux.x86_64" tools/export_web.sh _site/play
      # 作り手の 分担を 決める ための くらべもの（A・B の 2 つを 遊べる 形に する。一時的。決まったら 消す）。
      # 失敗しても ダッシュボードは 出す（その ときは くらべる リンクが 出ない）
      - name: Build the two comparison builds A and B (temporary)
        if: always()
        continue-on-error: true
        run: GODOT="$PWD/Godot_v4.7-stable_linux.x86_64" tools/compare/build.sh _site/compare
      # テストが落ちても、その結果をダッシュボードに出す
      - name: Publish dashboard page (main only)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build_dashboard.py --html _site/index.html --test-log /tmp/inside-body-seek-test.log --play-dir _site/play --compare-dir _site/compare
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
