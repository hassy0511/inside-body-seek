name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # main のときだけ gh-pages（ダッシュボード）へ push する
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7-stable_linux.x86_64
      - name: Import, floor probe and autopilot smoke test (all stages)
        run: GODOT="$PWD/Godot_v4.7-stable_linux.x86_64" tools/run_tests.sh
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/inside-body-seek-test.log*
      # テストが落ちても、その結果をダッシュボードに出す
      - name: Publish dashboard page (main only)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/build_dashboard.py --html _site/index.html --test-log /tmp/inside-body-seek-test.log
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dashboard: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
